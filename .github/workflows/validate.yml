name: Validate

on:
  push:
    paths:
      - 'community-catalogs/**/organization-catalog.json'
      - 'data/listing-news-sources.json'
      - 'data/pro-news.json'
      - 'schemas/**'
      - 'scripts/listing-news-policy.mjs'
      - 'scripts/listing-news-policy.test.mjs'
      - 'scripts/validate-listing-news.mjs'
      - 'package.json'
  pull_request:
    paths:
      - 'community-catalogs/**/organization-catalog.json'
      - 'data/listing-news-sources.json'
      - 'data/pro-news.json'
      - 'schemas/**'
      - 'scripts/listing-news-policy.mjs'
      - 'scripts/listing-news-policy.test.mjs'
      - 'scripts/validate-listing-news.mjs'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run validate

      - run: npm run validate:news

      - run: npm test
